      <rect x="947" y="199" width="6" height="14" rx="1"/><rect x="961" y="199" width="6" height="14" rx="1"/>
      <text x="960" y="192" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="78">B</text>
    </g>

