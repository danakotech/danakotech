      <circle cx="960" cy="165" r="118" stroke="#f7931a" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="2 8">
        <animateTransform attributeName="transform" type="rotate" from="360 960 165" to="0 960 165" dur="36s" repeatCount="indefinite"/>
