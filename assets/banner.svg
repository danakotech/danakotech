    <circle cx="960" cy="165" r="260" fill="url(#glowG)"/>

    <!-- barra de terminal -->
    <rect width="1200" height="34" fill="#161b22"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="62" cy="17" r="6" fill="#27c93f"/>
    <text x="600" y="22" text-anchor="middle" class="bar">azazel7@fullnode: ~/danakotech — ssh · tor · 21M</text>

    <!-- titulo con glitch -->
    <g class="title">
      <text x="56" y="128" fill="#00ffcc" opacity="0">AZAZEL<tspan>7</tspan>
        <animate attributeName="opacity" values="0;0;.8;0;0;.6;0" keyTimes="0;.9;.91;.92;.96;.965;1" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="x" values="56;56;52;56;56;61;56" keyTimes="0;.9;.91;.92;.96;.965;1" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="128" fill="#f7931a" opacity="0">AZAZEL<tspan>7</tspan>
        <animate attributeName="opacity" values="0;0;.8;0;0;.6;0" keyTimes="0;.9;.91;.92;.96;.965;1" dur="5s" begin=".05s" repeatCount="indefinite"/>
        <animate attributeName="x" values="60;60;65;60;60;55;60" keyTimes="0;.9;.91;.92;.96;.965;1" dur="5s" begin=".05s" repeatCount="indefinite"/>
