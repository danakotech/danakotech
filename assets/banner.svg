      <text x="58" y="128" fill="#e6edf3">AZAZEL<tspan fill="#f7931a">7</tspan></text>
    </g>
    <text x="60" y="172" class="sub">Danako · Cybersecurity · Bitcoin · Blockchain</text>
    <rect x="60" y="190" width="120" height="3" fill="#f7931a"/>
    <rect x="186" y="190" width="40" height="3" fill="#00ffcc"/>

    <!-- terminal: hash real del lema -->
    <text x="60" y="240" class="cmd" clip-path="url(#typeCmd)">$ echo -n &quot;Confidentiality is Freedom&quot; | sha256sum</text>
    <text x="60" y="268" class="hash" clip-path="url(#typeHash)">79bf121cd7cbfb7a0dd78034c91f6f921d853ad167dbe7b25feed732493d1b74</text>

    <!-- moneda bitcoin con anillos -->
    <circle cx="960" cy="165" r="120" fill="url(#glowO)">
